name: Docker Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  docker-release:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: jasonkryst/bookwheel
      VERSION_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve version and tags
        id: vars
        shell: bash
        run: |
          TAG="${VERSION_TAG}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/bookwheel"

          PROJECT_VERSION=$(dotnet msbuild BookWheel/BookWheel.csproj -getProperty:InformationalVersion -nologo | tr -d '\r\n')
          PROJECT_VERSION="${PROJECT_VERSION%%-*}"
          if [[ "${VERSION%%-*}" != "${PROJECT_VERSION}" ]]; then
            echo "Release tag '${TAG}' resolves to version ${VERSION}, but BookWheel.csproj's InformationalVersion is ${PROJECT_VERSION}. Bump the csproj version to match before tagging a release." >&2
            exit 1
          fi

          if [[ "${VERSION}" == *"-"* ]]; then
            IS_LATEST="false"
          else
            IS_LATEST="true"
          fi

          {
            echo "version=${VERSION}"
            echo "is_latest=${IS_LATEST}"
            echo "ghcr_image=${GHCR_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push version tags
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.ghcr_image }}:${{ steps.vars.outputs.version }}

      - name: Build and push latest tag
        if: steps.vars.outputs.is_latest == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ steps.vars.outputs.ghcr_image }}:latest