name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve app version
        run: |
          BASE_VERSION=$(dotnet msbuild BookWheel/BookWheel.csproj -getProperty:InformationalVersion -nologo | tr -d '\r\n')
          BASE_VERSION="${BASE_VERSION%%-*}"
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Refusing unexpected InformationalVersion format: $BASE_VERSION" >&2
            exit 1
          fi
          echo "APP_VERSION=${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore /p:InformationalVersion="$APP_VERSION"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Test
        run: dotnet test --verbosity normal

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Security vulnerability scan
        run: scripts/check-vulnerable-packages.sh BookWheel/BookWheel.csproj BookWheel.Tests/BookWheel.Tests.csproj

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve app version
        run: |
          BASE_VERSION=$(dotnet msbuild BookWheel/BookWheel.csproj -getProperty:InformationalVersion -nologo | tr -d '\r\n')
          BASE_VERSION="${BASE_VERSION%%-*}"
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Refusing unexpected InformationalVersion format: $BASE_VERSION" >&2
            exit 1
          fi
          echo "APP_VERSION=${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: bookwheel:${{ github.sha }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve app version
        run: |
          BASE_VERSION=$(dotnet msbuild BookWheel/BookWheel.csproj -getProperty:InformationalVersion -nologo | tr -d '\r\n')
          BASE_VERSION="${BASE_VERSION%%-*}"
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Refusing unexpected InformationalVersion format: $BASE_VERSION" >&2
            exit 1
          fi
          echo "APP_VERSION=${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: bookwheel:${{ github.sha }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container startup smoke verification
        run: |
          docker run -d --name bookwheel-smoke -p 18080:8080 bookwheel:${{ github.sha }}
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health/ready > /dev/null; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed readiness check"
          docker logs bookwheel-smoke
          exit 1
      - name: Cleanup smoke container
        if: always()
        run: docker rm -f bookwheel-smoke || true

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve app version
        run: |
          BASE_VERSION=$(dotnet msbuild BookWheel/BookWheel.csproj -getProperty:InformationalVersion -nologo | tr -d '\r\n')
          BASE_VERSION="${BASE_VERSION%%-*}"
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Refusing unexpected InformationalVersion format: $BASE_VERSION" >&2
            exit 1
          fi
          echo "APP_VERSION=${BASE_VERSION}-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: bookwheel:${{ github.sha }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability gate (fixable CRITICAL/HIGH findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bookwheel:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Full vulnerability report (all severities, including unfixed)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bookwheel:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
      - name: Upload scan results to the Security tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          sarif_file: trivy-results.sarif
