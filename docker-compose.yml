version: "3.9"

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: bookwheel-postgres:latest
    container_name: bookwheel-postgres
    environment:
      POSTGRES_DB: bookwheel
      POSTGRES_USER: bookwheel
      # Local-dev default only. Override via a .env file (POSTGRES_PASSWORD=...) for anything
      # beyond local dev — see README's "Data Storage" section.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookwheel}
      # Local-dev defaults only, same override guidance as POSTGRES_PASSWORD. These are the
      # passwords for two non-superuser roles the app actually connects as — the bootstrap
      # POSTGRES_USER/POSTGRES_PASSWORD role above is never used by the app itself once
      # these are provisioned (see scripts/postgres/init-least-privilege-roles.sh).
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-bookwheel_migrator}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-bookwheel_app}
    volumes:
      - bookwheel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookwheel -d bookwheel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bookwheel:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookwheel:latest
    container_name: bookwheel
    ports:
      - "32700:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Least-privilege runtime role (DML only) — see scripts/postgres/init-least-privilege-roles.sh.
      ConnectionStrings__BookWheel: "Host=postgres;Database=bookwheel;Username=bookwheel_app;Password=${POSTGRES_APP_PASSWORD:-bookwheel_app}"
      # Schema-owning role (not the Postgres bootstrap superuser), used only for the
      # one-time startup migration.
      ConnectionStrings__BookWheelMigrations: "Host=postgres;Database=bookwheel;Username=bookwheel_migrator;Password=${POSTGRES_MIGRATOR_PASSWORD:-bookwheel_migrator}"
      # Optional. Blank by default (no telemetry sent). Set GOOGLE_ANALYTICS_ID in your
      # own .env file to your own GA4 property ID to enable analytics for your deployment —
      # see README's "Analytics" section.
      Analytics__GoogleAnalyticsId: "${GOOGLE_ANALYTICS_ID:-}"
      # Optional. Blank by default (keyless public Google Books endpoint, lower quota).
      # Set GOOGLE_BOOKS_API_KEY in your own .env file for a higher request quota —
      # see README's "Book info providers" feature bullet.
      BookMetadata__GoogleBooks__ApiKey: "${GOOGLE_BOOKS_API_KEY:-}"
      # Set SMTP_HOST/SMTP_PORT/SMTP_USERNAME/SMTP_PASSWORD/SMTP_FROM_ADDRESS in
      # your own .env file to enable outbound email (password reset / forgotten
      # username links) — see README's "Email (SMTP)" section. Email delivery is
      # silently skipped (logged only) when SMTP_HOST is unset.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      # Optional. Blank by default (self-service password-reset emails are silently
      # skipped until this is set). Set APP_BASE_URL in your own .env file to the
      # public URL this deployment is reachable at (e.g. https://books.example.com)
      # so reset-link emails point somewhere real — see README's "Email (SMTP)" section.
      App__BaseUrl: "${APP_BASE_URL:-}"
      # Reverse proxy / forwarded headers. Set this when TLS is terminated at a reverse
      # proxy (Caddy, Traefik, Nginx Proxy Manager, Cloudflare Tunnel, ...) that reaches the
      # container from a non-loopback address. Without it, X-Forwarded-For / X-Forwarded-Proto
      # are ignored: every client shares one rate-limit bucket and the auth cookie is not
      # marked Secure. Leaving it empty keeps the secure default (trust loopback only).
      #
      # Trust the NARROWEST scope that reaches your proxy — anything inside a trusted range
      # can forge X-Forwarded-For, so an over-broad range re-opens the rate-limit bypass.
      # Best: pin the proxy's exact IP:
      #   ForwardedHeaders__KnownProxies__0: "172.18.0.5"
      # Otherwise: trust the proxy's actual subnet (find it with
      #   docker network inspect <network> --format '{{(index .IPAM.Config 0).Subnet}}'
      # — typically a /16 or /24, NOT the whole 172.16.0.0/12 Docker block):
      #   FORWARDED_KNOWN_NETWORKS=172.18.0.0/16            # flat, comma-separated CIDRs
      #   ForwardedHeaders__KnownNetworks__0: "172.18.0.0/16"  # structured, equivalent
      # Only use 172.16.0.0/12 on a single-tenant host you fully control. See the README's
      # "Reverse proxy and forwarded headers" section.
      # Optional override when the proxy cannot forward X-Forwarded-Proto (HTTPS only):
      #   Security__AlwaysSecureCookie: "true"
      FORWARDED_KNOWN_NETWORKS: "${FORWARDED_KNOWN_NETWORKS:-}"
      # Host-header filtering. Defaults to "*" (accept any Host). For a public deployment,
      # set ALLOWED_HOSTS in your .env to the hostname(s) this instance serves so the app
      # rejects requests with a forged Host header (e.g. ALLOWED_HOSTS=books.example.com).
      # Semicolon-separate multiple hosts, and include "localhost" if an in-container health
      # probe hits the app directly (e.g. ALLOWED_HOSTS=books.example.com;localhost). This
      # maps to ASP.NET Core's "AllowedHosts" config key.
      AllowedHosts: "${ALLOWED_HOSTS:-*}"
    volumes:
      - bookwheel_app_data:/app/App_Data
      - bookwheel_dp_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bookwheel_app_data:
    name: bookwheel_app_data
  bookwheel_dp_keys:
    name: bookwheel_dp_keys
  bookwheel_pg_data:
    name: bookwheel_pg_data
